<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#d7d9d5;font-family:Arial,Helvetica,sans-serif;pointer-events:none;user-select:none}
#panel{position:fixed;right:4vw;top:50%;transform:translateY(-50%);width:310px;padding:16px 18px;background:rgba(13,15,14,.93);border:1px solid #3b423c;box-shadow:0 16px 48px rgba(0,0,0,.45);display:none}
#panel.visible{display:block}.eyebrow{font-size:9px;letter-spacing:2px;color:#858b84;margin-bottom:7px}.title{font-size:15px;font-weight:800;letter-spacing:3px;color:#c2a65b;margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #252a26;font-size:10px}.row span:first-child{color:#858b84;letter-spacing:1px}.row b{font-size:12px}.hours{font-size:42px;font-weight:800;line-height:1;text-align:center;margin:8px 0 14px;color:#d7d9d5}.sub{text-align:center;font-size:9px;color:#858b84;margin-bottom:12px}.probe{font-size:8px;line-height:1.4;color:#666e68;word-break:break-all;margin-top:10px}.warn{color:#bda86b}.tag{display:inline-block;border:1px solid #4a514b;padding:3px 6px;font-size:8px;letter-spacing:1px;color:#9da39d;margin-top:10px}
</style>
</head>
<body>
<div id="panel">
  <div class="eyebrow">READ-ONLY VALIDATION MIRROR</div>
  <div class="title" id="title">SLEEP / WAIT</div>
  <div class="hours" id="hours">?</div>
  <div class="sub" id="range">LIVE VANILLA VALUE NOT RESOLVED</div>
  <div class="row"><span>MODE</span><b id="mode">?</b></div>
  <div class="row"><span>NATIVE ACTIVE</span><b id="active">?</b></div>
  <div class="row"><span>APP PAUSED</span><b id="paused">?</b></div>
  <div class="probe" id="probe"></div>
  <div class="tag">VANILLA MENU STILL CONTROLS ACCEPT / CANCEL</div>
</div>
<script>
(function(){
  var pollTimer=0;
  function normalize(v){if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return null}}return v}
  function text(id,v){document.getElementById(id).textContent=v}
  function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=0}}
  function startPolling(){if(!pollTimer)pollTimer=setInterval(function(){if(typeof requestSleepWaitMirrorUpdate==='function')requestSleepWaitMirrorUpdate('')},150)}
  window.updateSleepWaitMirror=function(v){
    var d=normalize(v);if(!d)return;
    var panel=document.getElementById('panel');panel.className=d.visible?'visible':'';if(!d.visible){stopPolling();return}
    startPolling();
    var hasHours=Number.isInteger(d.hours);
    text('title',(d.mode==='wait'?'WAIT':'SLEEP')+' MIRROR');
    text('hours',hasHours?String(d.hours):'?');
    text('range',hasHours?(String(d.hours)+' HOUR'+(Number(d.hours)===1?'':'S')+(d.maxHours!=null?' · MAX '+d.maxHours:'')):'LIVE VANILLA iHours PATH NOT YET RESOLVED');
    text('mode',String(d.mode||'?').toUpperCase());
    text('active',d.nativeActive?'YES':'NO');
    text('paused',d.appPaused?'YES':'NO');
    var p='iHours: '+(d.hoursPath||'unresolved')+'\niMaxHours: '+(d.maxHoursPath||'unresolved');
    text('probe',p);
    document.getElementById('probe').className='probe'+(!hasHours?' warn':'');
  };
})();
</script>
</body>
</html>

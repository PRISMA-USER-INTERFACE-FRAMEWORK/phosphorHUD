<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#d8dbd7;font-family:Arial,Helvetica,sans-serif;user-select:none}:root{--p:rgba(13,15,14,.97);--p2:rgba(20,23,21,.96);--l:#3b423c;--m:#858b84;--a:#c2a65b;--ok:#718d69}
#shell{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,86vw);background:var(--p);border:1px solid var(--l);box-shadow:0 20px 70px #000a;padding:18px}header{display:flex;align-items:center;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid var(--l)}.title{font-size:16px;font-weight:800;letter-spacing:3px;color:var(--a)}.muted{font-size:9px;color:var(--m);letter-spacing:1px}.clock{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:12px;padding:20px 0}.timebox{background:var(--p2);border:1px solid var(--l);padding:14px;text-align:center}.label{font-size:8px;color:var(--m);letter-spacing:2px}.time{font-size:34px;font-weight:800;margin-top:5px}.arrow{text-align:center;font-size:28px;color:var(--a)}.hours{text-align:center;font-size:58px;font-weight:800;line-height:1;margin:4px 0}.hours small{font-size:13px;color:var(--m);letter-spacing:2px}.range{text-align:center;color:var(--m);font-size:9px;margin-bottom:14px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding-top:12px;border-top:1px solid var(--l)}button{height:36px;border:1px solid var(--l);background:#151816;color:#d8dbd7;font-size:9px;font-weight:800;letter-spacing:1px;cursor:pointer}button:hover{border-color:var(--a);color:var(--a)}.slider{display:grid;grid-template-columns:1fr 72px;gap:10px;align-items:center;margin:12px 0}input[type=range]{width:100%;accent-color:#c2a65b}input[type=number]{width:72px;background:#0d100e;color:#d8dbd7;border:1px solid var(--l);padding:7px;text-align:right}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--l)}.accept{border-color:var(--ok)}#status{margin-top:10px;text-align:center;color:var(--m);font-size:8px;letter-spacing:1px}
</style></head><body><div id="shell"><header><div class="title" id="title">SLEEP / WAIT</div><div class="muted">BETHESDA SLEEPWAITMENU BACKEND</div></header><div class="clock"><div class="timebox"><div class="label">CURRENT</div><div class="time" id="current">--:--</div></div><div class="arrow">→</div><div class="timebox"><div class="label">TARGET</div><div class="time" id="target">--:--</div></div></div><div class="hours"><span id="hours">1</span> <small>HOURS</small></div><div class="range" id="range">MAX 24 HOURS</div><div class="slider"><input id="slider" type="range" min="1" max="24" value="1"><input id="number" type="number" min="1" max="24" value="1"></div><div class="controls"><button data-step="-12">-12 HOURS</button><button data-step="-1">-1 HOUR</button><button data-step="1">+1 HOUR</button><button data-step="12">+12 HOURS</button></div><div class="targets"><button data-hour="6">06:00</button><button data-hour="8">08:00</button><button data-hour="12">12:00</button><button data-hour="18">18:00</button><button data-hour="22">22:00</button></div><div class="actions"><button id="cancel">CANCEL</button><button id="accept" class="accept">ACCEPT</button></div><div id="status">WAITING FOR LIVE MENU STATE</div></div>
<script>(function(){var state={hours:1,maxHours:24,currentHour:0,targetHour:1,targetDayOffset:0,mode:'sleep'};function norm(v){if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return null}}return v}function send(s){if(typeof sleepWaitAction==='function')sleepWaitAction(s)}function fmt(v){v=((Number(v)||0)%24+24)%24;var h=Math.floor(v),m=Math.round((v-h)*60);if(m>=60){h=(h+1)%24;m=0}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function clamp(v){return Math.max(1,Math.min(Number(state.maxHours)||24,Math.round(Number(v)||1)))}function render(){var h=clamp(state.hours),max=Math.max(1,Number(state.maxHours)||24);document.getElementById('title').textContent=String(state.mode||'sleep').toUpperCase();document.getElementById('hours').textContent=h;document.getElementById('range').textContent='MAX '+max+' HOURS'+(state.targetDayOffset?' · +'+state.targetDayOffset+' DAY'+(state.targetDayOffset===1?'':'S'):'');document.getElementById('current').textContent=fmt(state.currentHour);document.getElementById('target').textContent=fmt(state.targetHour);var slider=document.getElementById('slider'),num=document.getElementById('number');slider.max=max;slider.value=h;num.max=max;num.value=h;document.getElementById('status').textContent=(state.nativeActive?'TIME ADVANCEMENT ACTIVE':'READY')+' · VANILLA iHours '+(state.hoursPath||'UNRESOLVED')}
window.setSleepWait=function(v){var d=norm(v);if(!d)return;state=d;render()};document.querySelectorAll('[data-step]').forEach(function(b){b.onclick=function(){send('step|'+b.dataset.step)}});document.querySelectorAll('[data-hour]').forEach(function(b){b.onclick=function(){var target=Number(b.dataset.hour),current=Number(state.currentHour)||0,delta=target-current;while(delta<=0)delta+=24;send('set|'+Math.max(1,Math.round(delta)))}});document.getElementById('slider').oninput=function(){send('set|'+clamp(this.value))};document.getElementById('number').onchange=function(){send('set|'+clamp(this.value))};document.getElementById('accept').onclick=function(){send('accept')};document.getElementById('cancel').onclick=function(){send('cancel')};document.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();send('cancel')}else if(e.key==='Enter'){e.preventDefault();send('accept')}else if(e.key==='ArrowLeft'){e.preventDefault();send('step|-1')}else if(e.key==='ArrowRight'){e.preventDefault();send('step|1')}});setInterval(function(){if(typeof sleepWaitTick==='function')sleepWaitTick('')},150);render()})();</script></body></html>

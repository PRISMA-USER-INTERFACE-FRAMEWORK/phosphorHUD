<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PrismaHUD Survival</title>
<link rel="stylesheet" href="hud_survival.css">
</head>
<body>
<div id="root">
  <div class="row">
    <span class="row-lbl">FOOD</span>
    <div class="bar-track"><div class="bar-fill fill-h" id="hFill" style="width:0%"></div></div>
    <span class="bar-num" id="hNum">0</span>
  </div>
  <div class="row">
    <span class="row-lbl">WATER</span>
    <div class="bar-track"><div class="bar-fill fill-t" id="tFill" style="width:0%"></div></div>
    <span class="bar-num" id="tNum">0</span>
  </div>
  <div class="row">
    <span class="row-lbl">SLEEP</span>
    <div class="bar-track"><div class="bar-fill fill-s" id="sFill" style="width:0%"></div></div>
    <span class="bar-num" id="sNum">0</span>
  </div>
</div>
<script src="hud_survival.js"></script>
</body>
</html>

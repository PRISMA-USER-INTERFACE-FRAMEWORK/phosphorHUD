<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#d7d9d5;font-family:Arial,Helvetica,sans-serif;user-select:none}:root{--panel:rgba(13,15,14,.96);--panel2:rgba(20,23,21,.94);--line:#3b423c;--text:#d7d9d5;--muted:#858b84;--accent:#c2a65b;--ok:#718d69;--bad:#b44d43}
#shell{position:fixed;inset:4vh 5vw;display:grid;grid-template-rows:54px 40px 1fr 58px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.6)}header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.title{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--accent)}.status{font-size:10px;letter-spacing:1px;color:var(--muted)}
#tabs{display:flex;gap:4px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto}.tab{height:29px;padding:0 10px;border:1px solid var(--line);background:#151816;color:#b7bbb6;font-size:8px;font-weight:800;letter-spacing:1px;cursor:pointer}.tab.on{border-color:var(--accent);color:var(--accent)}
main{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.side{min-height:0;display:grid;grid-template-rows:40px 42px 1fr 42px;border:1px solid var(--line);background:var(--panel2)}.side-title{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:2px}.side-title b{color:var(--accent)}.search{margin:7px 9px;border:1px solid var(--line);background:#0d100e;color:var(--text);padding:7px 9px;font-size:11px;outline:none}.search:focus{border-color:var(--accent)}.list{overflow:auto;padding:4px 8px 10px}.row{display:grid;grid-template-columns:1fr 105px 62px 50px;gap:8px;align-items:center;min-height:42px;padding:5px 7px;border-bottom:1px solid #252a26;cursor:pointer}.row:hover{background:rgba(194,166,91,.08)}.row:active{background:rgba(194,166,91,.16)}.row.exhausted{opacity:.38;cursor:default}.name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cat{display:block;font-size:8px;color:var(--muted);margin-top:2px}.count,.value{text-align:right;font-size:10px;color:var(--muted)}.value{color:var(--accent)}.queued{color:var(--accent)}.empty{padding:22px;color:var(--muted);font-size:11px;text-align:center}.qty-open{height:26px;border:1px solid var(--line);background:#151816;color:var(--text);font-size:8px;font-weight:800;letter-spacing:1px;cursor:pointer}.qty-open:hover{border-color:var(--accent)}.qty-open:disabled{opacity:.25;cursor:default}.bulkbar{display:flex;align-items:center;justify-content:flex-end;padding:6px 8px;border-top:1px solid var(--line)}
footer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--line)}.ledger{display:flex;align-items:center;gap:16px}.owed{font-size:14px;font-weight:800;letter-spacing:1px}.owed.good{color:var(--ok)}.owed.bad{color:var(--bad)}.hint{font-size:9px;color:var(--muted)}.buttons{display:flex;gap:7px}.btn{height:34px;min-width:92px;border:1px solid var(--line);background:#151816;color:var(--text);font-size:9px;font-weight:800;letter-spacing:1px;cursor:pointer}.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.28;cursor:default}.btn.accept:not(:disabled){border-color:var(--ok)}
#qty-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.56);z-index:20}#qty-modal.open{display:flex}.qty-box{width:360px;background:#111411;border:1px solid var(--accent);padding:18px;box-shadow:0 18px 60px #000}.qty-title{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--accent);margin-bottom:5px}.qty-name{font-size:11px;margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qty-line{display:grid;grid-template-columns:1fr 72px;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:10px}.qty-line input{width:72px;background:#0a0d0b;color:var(--text);border:1px solid var(--line);padding:7px;text-align:right;outline:none}.qty-line input:focus{border-color:var(--accent)}.qty-actions{display:flex;justify-content:flex-end;gap:7px}.qty-meta{font-size:9px;color:var(--muted);margin-bottom:14px}
</style></head><body><div id="shell"><header><div class="title">PRISMA BARTER</div><div class="status" id="trade-state">BETHESDA TRANSACTION BACKEND</div></header><div id="tabs"></div><main><section class="side"><div class="side-title"><span id="player-name">PLAYER</span><b>SELL</b></div><input id="player-search" class="search" placeholder="SEARCH YOUR ITEMS" autocomplete="off"><div id="player-list" class="list"></div><div class="bulkbar"><button id="sell-cat" class="btn">SELL CATEGORY</button></div></section><section class="side"><div class="side-title"><span id="vendor-name">VENDOR</span><b>BUY</b></div><input id="vendor-search" class="search" placeholder="SEARCH VENDOR ITEMS" autocomplete="off"><div id="vendor-list" class="list"></div><div class="bulkbar"><button id="buy-cat" class="btn">BUY CATEGORY</button></div></section></main><footer><div class="ledger"><div id="owed" class="owed">NO TRADE QUEUED</div><div class="hint">CLICK = 1 · SHIFT-CLICK = ALL REMAINING · CATEGORY BULK SKIPS PLAYER FAVORITES</div></div><div class="buttons"><button id="reset" class="btn">RESET</button><button id="accept" class="btn accept">ACCEPT</button><button id="close" class="btn">CLOSE</button></div></footer></div><div id="qty-modal" aria-hidden="true"><div class="qty-box"><div class="qty-title" id="qty-title">QUANTITY</div><div class="qty-name" id="qty-name"></div><div class="qty-meta" id="qty-meta"></div><div class="qty-line"><span>AMOUNT</span><input id="qty-input" type="number" min="1" step="1" inputmode="numeric"></div><div class="qty-actions"><button id="qty-cancel" class="btn">CANCEL</button><button id="qty-confirm" class="btn accept">QUEUE</button></div></div></div>
<script>(function(){
var state={active:false,player:[],vendor:[],capsOwed:0,validTrade:false,playerName:'PLAYER',vendorName:'VENDOR'},query={player:'',vendor:''},qtyTarget=null;
var cats=[['ALL',4294967295],['WEAPONS',2],['APPAREL',4],['AID',8],['MISC',512],['JUNK',1024],['MODS',2048],['AMMO',4096],['NOTES',128],['HOLOTAPES',8192]],mask=4294967295;
function normalize(v){if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return null}}return v}function send(s){if(typeof barterAction==='function')barterAction(s)}function esc(s){return String(s==null?'':s)}function remaining(r){var n=Number(r.remaining);if(!isFinite(n)||n<0)n=0;return Math.floor(n)}
function filtered(side){var q=query[side].trim().toLowerCase(),rows=state[side]||[];return rows.filter(function(r){if(mask!==4294967295&&(Number(r.filterFlag)&mask)===0)return false;return!q||esc(r.name).toLowerCase().indexOf(q)!==-1})}
function renderTabs(){var box=document.getElementById('tabs');box.innerHTML='';cats.forEach(function(c){var b=document.createElement('button');b.className='tab'+(mask===c[1]?' on':'');b.textContent=c[0];b.onclick=function(){mask=c[1];renderTabs();renderList('player');renderList('vendor')};box.appendChild(b)})}
function sendTransfer(side,r,count){var max=remaining(r);count=Math.floor(Number(count)||0);if(count<1)return;if(r.quantityKnown&&count>max)count=max;if(!r.quantityKnown&&count>1)return;if(count<1)return;send('transfer|'+side+'|'+r.index+'|'+r.handle+'|'+(r.stackKey||'')+'|'+count)}function closeQty(){qtyTarget=null;var m=document.getElementById('qty-modal');m.className='';m.setAttribute('aria-hidden','true')}function openQty(side,r){if(!r.quantityKnown||remaining(r)<=1)return;qtyTarget={side:side,row:r};var max=remaining(r),input=document.getElementById('qty-input');document.getElementById('qty-title').textContent=side==='vendor'?'BUY QUANTITY':'SELL QUANTITY';document.getElementById('qty-name').textContent=r.name||'?';document.getElementById('qty-meta').textContent=max+' REMAINING · '+(r.barterCount||0)+' ALREADY QUEUED · '+(r.value||0)+' CAPS EACH';input.min='1';input.max=String(max);input.value=String(max);var m=document.getElementById('qty-modal');m.className='open';m.setAttribute('aria-hidden','false');input.focus();input.select()}
function row(side,r){var el=document.createElement('div'),rem=remaining(r),queued=Math.max(0,Number(r.barterCount)||0);el.className='row'+(rem===0?' exhausted':'');el.innerHTML='<div class="name"></div><div class="count"></div><div class="value"></div><button class="qty-open">QTY</button>';el.children[0].textContent=r.name||'?';var cat=document.createElement('span');cat.className='cat';cat.textContent=r.category||'OTHER';el.children[0].appendChild(cat);el.children[1].textContent=rem+' LEFT'+(queued?' · '+queued+' Q':'');if(queued)el.children[1].classList.add('queued');el.children[2].textContent=(r.value||0)+' ¢';var qb=el.children[3];qb.disabled=!r.quantityKnown||rem<=1;qb.onclick=function(e){e.stopPropagation();openQty(side,r)};el.onclick=function(e){if(rem===0)return;sendTransfer(side,r,e.shiftKey&&r.quantityKnown?rem:1)};return el}
function renderList(side){var box=document.getElementById(side+'-list');box.innerHTML='';var rows=filtered(side);if(!rows.length){var e=document.createElement('div');e.className='empty';e.textContent=query[side]?'NO MATCHES':'NO ITEMS';box.appendChild(e);return}rows.forEach(function(r){box.appendChild(row(side,r))})}
function renderLedger(){var owed=Number(state.capsOwed)||0,el=document.getElementById('owed');el.className='owed';if(owed>0){el.textContent='YOU OWE '+owed+' CAPS';el.classList.add('bad')}else if(owed<0){el.textContent='VENDOR OWES '+Math.abs(owed)+' CAPS';el.classList.add('good')}else el.textContent='NO TRADE QUEUED';document.getElementById('accept').disabled=!state.validTrade;document.getElementById('reset').disabled=owed===0;document.getElementById('trade-state').textContent=state.validTrade?'TRADE VALID':'BETHESDA TRANSACTION BACKEND'}function render(){document.getElementById('player-name').textContent=(state.playerName||'PLAYER').toUpperCase();document.getElementById('vendor-name').textContent=(state.vendorName||'VENDOR').toUpperCase();renderTabs();renderList('player');renderList('vendor');renderLedger()}
window.setBarter=function(v){var d=normalize(v);if(!d)return;closeQty();state=d;state.player=state.player||[];state.vendor=state.vendor||[];render()};['player','vendor'].forEach(function(side){document.getElementById(side+'-search').addEventListener('input',function(){query[side]=this.value||'';renderList(side)})});document.getElementById('sell-cat').onclick=function(){send('bulk|player|'+mask)};document.getElementById('buy-cat').onclick=function(){send('bulk|vendor|'+mask)};document.getElementById('reset').onclick=function(){closeQty();send('reset')};document.getElementById('accept').onclick=function(){if(state.validTrade){closeQty();send('accept')}};document.getElementById('close').onclick=function(){closeQty();send('close')};document.getElementById('qty-cancel').onclick=closeQty;document.getElementById('qty-confirm').onclick=function(){if(!qtyTarget)return;var n=Number(document.getElementById('qty-input').value);sendTransfer(qtyTarget.side,qtyTarget.row,n);closeQty()};document.getElementById('qty-input').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.getElementById('qty-confirm').click()}else if(e.key==='Escape'){e.preventDefault();closeQty()}});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!qtyTarget){e.preventDefault();send('close')}});setInterval(function(){if(typeof barterTick==='function')barterTick('')},250);render()})();</script></body></html>

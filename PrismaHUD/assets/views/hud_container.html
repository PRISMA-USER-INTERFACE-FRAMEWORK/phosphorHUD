<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#d8dbd7;font-family:Arial,Helvetica,sans-serif;user-select:none}:root{--p:rgba(13,15,14,.96);--p2:rgba(20,23,21,.94);--l:#3b423c;--m:#858b84;--a:#c2a65b}
#shell{position:fixed;inset:4vh 5vw;display:grid;grid-template-rows:52px 42px 1fr 54px;background:var(--p);border:1px solid var(--l);box-shadow:0 18px 60px #0009}header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--l)}.title{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--a)}.muted{font-size:9px;color:var(--m);letter-spacing:1px}
#tabs{display:flex;gap:4px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--l);overflow-x:auto}.tab{height:29px;padding:0 10px;border:1px solid var(--l);background:#151816;color:#b7bbb6;font-size:8px;font-weight:800;letter-spacing:1px;cursor:pointer}.tab.on{border-color:var(--a);color:var(--a)}
main{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.side{min-height:0;display:grid;grid-template-rows:40px 38px 1fr 44px;border:1px solid var(--l);background:var(--p2)}.side-title{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--l);font-size:11px;font-weight:800;letter-spacing:2px}.side-title b{color:var(--a)}.search{margin:5px 8px;border:1px solid var(--l);background:#0d100e;color:#d8dbd7;padding:6px 8px;font-size:10px;outline:none}.search:focus{border-color:var(--a)}.list{overflow:auto;padding:3px 7px 8px}.row{display:grid;grid-template-columns:1fr 74px 55px;gap:8px;align-items:center;min-height:38px;padding:5px 7px;border-bottom:1px solid #262b27;cursor:pointer}.row:hover{background:#c2a65b13}.name{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta,.value{text-align:right;font-size:9px;color:var(--m)}.value{color:var(--a)}.badges{font-size:8px;color:#aaa;margin-left:5px}.bulkbar{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:6px 8px;border-top:1px solid var(--l)}button{height:30px;border:1px solid var(--l);background:#151816;color:#d8dbd7;font-size:8px;font-weight:800;letter-spacing:1px;cursor:pointer}button:hover{border-color:var(--a)}footer{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--l)}.empty{padding:20px;text-align:center;color:var(--m);font-size:10px}
</style></head>
<body><div id="shell"><header><div class="title">PRISMA INVENTORY</div><div class="muted">BETHESDA CONTAINERMENU BACKEND</div></header><div id="tabs"></div><main>
<section class="side"><div class="side-title"><span id="player-name">PLAYER</span><b>STORE</b></div><input id="player-search" class="search" placeholder="SEARCH YOUR ITEMS"><div id="player-list" class="list"></div><div class="bulkbar"><button id="store-cat">STORE CATEGORY</button></div></section>
<section class="side"><div class="side-title"><span id="container-name">CONTAINER</span><b>TAKE</b></div><input id="container-search" class="search" placeholder="SEARCH CONTAINER"><div id="container-list" class="list"></div><div class="bulkbar"><button id="take-cat">TAKE CATEGORY</button><button id="take-all">TAKE ALL</button></div></section>
</main><footer><div class="muted">BULK STORE SKIPS FAVORITES AND EQUIPPED ITEMS</div><button id="close">CLOSE</button></footer></div>
<script>(function(){
var state={player:[],container:[],playerName:'PLAYER',containerName:'CONTAINER'},q={player:'',container:''};
var cats=[['ALL',4294967295],['WEAPONS',2],['APPAREL',4],['AID',8],['MISC',512],['JUNK',1024],['MODS',2048],['AMMO',4096],['NOTES',128],['HOLOTAPES',8192]],mask=4294967295;
function norm(v){if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return null}}return v}function send(s){if(typeof containerAction==='function')containerAction(s)}
function matches(r,side){if(mask!==4294967295&&(Number(r.filterFlag)&mask)===0)return false;var s=q[side].trim().toLowerCase();return !s||String(r.name||'').toLowerCase().indexOf(s)!==-1}
function transfer(side,r,count){count=Math.max(1,Math.min(Number(r.count)||1,Number(count)||1));send('transfer|'+side+'|'+r.index+'|'+r.handle+'|'+(r.stackKey||'')+'|'+count)}
function row(side,r){var el=document.createElement('div');el.className='row';el.innerHTML='<div class="name"></div><div class="meta"></div><div class="value"></div>';var badges='';if(r.equipped)badges+=' E';if(r.favorite)badges+=' F';if(r.legendary)badges+=' ★';el.children[0].textContent=r.name||'?';if(badges){var b=document.createElement('span');b.className='badges';b.textContent=badges;el.children[0].appendChild(b)}el.children[1].textContent=(r.count||0)+' · '+(r.category||'');el.children[2].textContent=(r.value||0)+' ¢';el.onclick=function(e){transfer(side,r,e.shiftKey?r.count:1)};return el}
function renderList(side){var box=document.getElementById(side+'-list');box.innerHTML='';var rows=(state[side]||[]).filter(function(r){return matches(r,side)});if(!rows.length){var e=document.createElement('div');e.className='empty';e.textContent='NO ITEMS';box.appendChild(e);return}rows.sort(function(a,b){return String(a.name).localeCompare(String(b.name))});rows.forEach(function(r){box.appendChild(row(side,r))})}
function renderTabs(){var box=document.getElementById('tabs');box.innerHTML='';cats.forEach(function(c){var b=document.createElement('button');b.className='tab'+(mask===c[1]?' on':'');b.textContent=c[0];b.onclick=function(){mask=c[1];renderTabs();renderList('player');renderList('container')};box.appendChild(b)})}
function render(){document.getElementById('player-name').textContent=String(state.playerName||'PLAYER').toUpperCase();document.getElementById('container-name').textContent=String(state.containerName||'CONTAINER').toUpperCase();renderTabs();renderList('player');renderList('container')}
window.setContainer=function(v){var d=norm(v);if(!d)return;state=d;state.player=state.player||[];state.container=state.container||[];render()};
['player','container'].forEach(function(side){document.getElementById(side+'-search').addEventListener('input',function(){q[side]=this.value||'';renderList(side)})});
document.getElementById('store-cat').onclick=function(){send('bulk|player|'+mask)};document.getElementById('take-cat').onclick=function(){send('bulk|container|'+mask)};document.getElementById('take-all').onclick=function(){send('takeall')};document.getElementById('close').onclick=function(){send('close')};document.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();send('close')}});setInterval(function(){if(typeof containerTick==='function')containerTick('')},250);render();
})();</script></body></html>

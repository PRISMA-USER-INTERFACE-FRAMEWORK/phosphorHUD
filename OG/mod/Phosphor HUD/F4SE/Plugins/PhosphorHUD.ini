; Phosphor HUD plugin options (not in MCM)
[Main]
; 1 = the HUD shows your live game state after a save loads. 0 = only the Ctrl+F10 replay.
bLiveHud=1
; 1 = hide the vanilla health, AP, radiation and XP meters that Phosphor replaces (never in power armor).
bHideVanillaMeters=1
; Map markers (settlements, vaults, landmarks...) on the compass within this many metres. 0 = none.
iLocationMarkerMeters=100

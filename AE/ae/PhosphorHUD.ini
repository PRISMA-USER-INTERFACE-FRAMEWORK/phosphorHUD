; Phosphor HUD plugin options (not in MCM)
[Main]
; 1 = the HUD shows your live game state after a save loads. 0 = only the Ctrl+F10 replay.
bLiveHud=1
; 1 = hide the vanilla health, AP, radiation and XP meters that Phosphor replaces (never in power armor).
bHideVanillaMeters=1
; Map markers (settlements, vaults, landmarks...) on the compass within this many metres. 0 = none.
iLocationMarkerMeters=100

; Quest data comes from the engine; 0 uses only the optional Pip-Boy feed.
bEngineQuestData=1
; Diagnostic dump on Ctrl+F11 (game thread); off by default.
bEngineProbe=0

[Experimental]
; AE test build only. 1 = on, 0 = Phosphor does not read that part of the game at all.
; If the game crashes, turn these off one at a time to find which part is responsible, and say so in your report.
bCompass=1
bEnemies=1
bMarkerHeights=1
bMines=1
bTarget=1
bQuickLoot=1
bNativeHudText=1
bCrosshair=1
bFlashlight=1
bSurvival=1
bEffects=1
bCompanions=1
bPipboyFeed=1
bModData=1
bHideVanilla=1
; Engine quests, targets, map locations and waypoints. Also requires bCompass=1.
bEngineQuests=1
